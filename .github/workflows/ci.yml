name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: uniride
          POSTGRES_USER: uniride
          POSTGRES_PASSWORD: uniride_dev_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U uniride"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://uniride:uniride_dev_password@localhost:5432/uniride
      SECRET_KEY: ci-test-secret-key
      # Optional: if GOOGLE_MAPS_API_KEY isn't set as a repo secret, route-overlap
      # tests fall back to the Phase 5 distance-based score and still pass -
      # see tests/test_matching_api.py::test_compatible_rides_match.
      GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Run database migrations
        run: python -m alembic -c alembic.ini upgrade head

      - name: Run backend test suite
        working-directory: backend
        run: python -m pytest -q

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Typecheck and build
        working-directory: frontend
        run: npm run build
