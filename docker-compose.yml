services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-uniride}
      POSTGRES_USER: ${POSTGRES_USER:-uniride}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-uniride_dev_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-uniride}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
